# قبس — CI: يبني عند تغيير الكود + يُنشئ ملف Delta صغير
name: Build & Sign APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
      - '.env.example'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" 2>/dev/null || true

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.0.0/gradle/wrapper/gradle-wrapper.jar"
          python3 -c "import zipfile; zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist(); print('wrapper jar OK')"
          chmod +x gradlew

      - name: Inject secrets (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          {
            echo "SUPABASE_URL=\"${SUPABASE_URL:-https://YOUR_PROJECT_REF.supabase.co}\""
            echo "SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY:-your_publishable_or_anon_key}\""
            echo "GEMINI_API_KEY=\"${GEMINI_API_KEY:-your_key}\""
            echo "AZURE_SPEECH_KEY=\"your_key\""
            echo "AZURE_SPEECH_REGION=\"your_region\""
            echo "ELEVENLABS_API_KEY=\"your_key\""
            echo "GROQ_API_KEY=\"your_key\""
            echo "HUGGINGFACE_API_KEY=\"your_key\""
            echo "PEXELS_API_KEY=\"your_key\""
            echo "PIXABAY_API_KEY=\"your_key\""
            echo "QF_CLIENT_ID=\"${QF_CLIENT_ID:-your_key}\""
            echo "QF_CLIENT_SECRET=\"${QF_CLIENT_SECRET:-your_key}\""
          } > .env

      - name: Assemble Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --build-cache

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qabas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # ── Delta Patch: ملف صغير بدل APK كامل ──
      - name: Generate delta patch & publish release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NEW_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE="${{ github.run_number }}"
          APK_SIZE=$(du -h "$NEW_APK" | cut -f1)
          TAG="v${VERSION}+${{ github.run_number }}"

          echo "APK: $NEW_APK ($APK_SIZE) | Version: $VERSION ($VERSION_CODE) | Tag: $TAG"

          # ── حمّل آخر APK من GitHub Releases ──
          PREV_APK="/tmp/prev.apk"
          PATCH_FILE="/tmp/qabas-${VERSION}.delta"

          LAST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "Last release: ${LAST_RELEASE:-none}"

          if [ -n "$LAST_RELEASE" ] && [ "$LAST_RELEASE" != "null" ]; then
            echo "Downloading previous APK from $LAST_RELEASE..."
            gh release download "$LAST_RELEASE" \
              --pattern "*.apk" \
              --cwd /tmp \
              --skip-existing 2>/dev/null || true

            PREV_APK=$(ls /tmp/*.apk 2>/dev/null | head -1 || echo "")

            if [ -n "$PREV_APK" ] && [ -f "$PREV_APK" ]; then
              echo "Previous APK found: $PREV_APK"

              # ثبّت xdelta3
              sudo apt-get update -qq && sudo apt-get install -y -qq xdelta3 2>/dev/null

              # أنشئ ملف الفرق
              xdelta3 -e -s "$PREV_APK" "$NEW_APK" "$PATCH_FILE" || true

              if [ -f "$PATCH_FILE" ] && [ -s "$PATCH_FILE" ]; then
                PATCH_SIZE=$(du -h "$PATCH_FILE" | cut -f1)
                echo "Delta patch created: $PATCH_SIZE (vs full APK: $APK_SIZE)"
                IS_DELTA="true"
              else
                echo "Delta creation failed — uploading full APK only"
                IS_DELTA="false"
              fi

              rm -f "$PREV_APK"
            else
              echo "No previous APK found — uploading full APK"
              IS_DELTA="false"
            fi
          else
            echo "No previous releases — uploading full APK"
            IS_DELTA="false"
          fi

          # ── ارفع كـ GitHub Release ──
          COMMITS_SINCE_TAG=$(git log "${LAST_RELEASE:-$(git rev-list --max-parents=0 HEAD | head -1)}..HEAD" --pretty=format"- %s" 2>/dev/null | head -20 || true)
          RELEASE_NOTES="Qabas $VERSION ($VERSION_CODE) | APK: $APK_SIZE"

          if [ "$IS_DELTA" = "true" ]; then
            PATCH_SIZE=$(du -h "$PATCH_FILE" | cut -f1)
            RELEASE_NOTES="$RELEASE_NOTES | Delta: $PATCH_SIZE"
          fi

          RELEASE_NOTES="$RELEASE_NOTES | Download .delta for small update, or full APK"

          if [ -n "$COMMITS_SINCE_TAG" ]; then
            RELEASE_NOTES="$RELEASE_NOTES
            التغييرات:
            $COMMITS_SINCE_TAG"
          fi

          # احذف Release cũ بنفس الـ tag لو موجود
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # أنشئ Release جديد
          gh release create "$TAG" \
            --title "Qabas $VERSION" \
            --notes "$RELEASE_NOTES" \
            "$NEW_APK"

          # أضف ملف Delta إن وُجد
          if [ "$IS_DELTA" = "true" ] && [ -f "$PATCH_FILE" ]; then
            gh release upload "$TAG" "$PATCH_FILE" --clobber
            echo "✅ Delta patch uploaded alongside full APK"
          fi

          echo "✅ Release published: $TAG"

      - name: On failure — print Kotlin errors hint
        if: failure()
        run: |
          echo "ابحث في اللوج عن: e: file://  أو Unresolved reference"
