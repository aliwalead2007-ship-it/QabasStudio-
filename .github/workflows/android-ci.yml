# قبس — CI: يبني عند تغيير الكود + يُنشئ ملف Delta صغير
name: Build & Sign APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
      - '.env.example'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" 2>/dev/null || true

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.0.0/gradle/wrapper/gradle-wrapper.jar"
          python3 -c "import zipfile; zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist(); print('wrapper jar OK')"
          chmod +x gradlew

      - name: Inject secrets (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          {
            echo "SUPABASE_URL=\"${SUPABASE_URL:-https://YOUR_PROJECT_REF.supabase.co}\""
            echo "SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY:-your_publishable_or_anon_key}\""
            echo "GEMINI_API_KEY=\"${GEMINI_API_KEY:-your_key}\""
            echo "AZURE_SPEECH_KEY=\"your_key\""
            echo "AZURE_SPEECH_REGION=\"your_region\""
            echo "ELEVENLABS_API_KEY=\"your_key\""
            echo "GROQ_API_KEY=\"your_key\""
            echo "HUGGINGFACE_API_KEY=\"your_key\""
            echo "PEXELS_API_KEY=\"your_key\""
            echo "PIXABAY_API_KEY=\"your_key\""
            echo "QF_CLIENT_ID=\"${QF_CLIENT_ID:-your_key}\""
            echo "QF_CLIENT_SECRET=\"${QF_CLIENT_SECRET:-your_key}\""
          } > .env

      - name: Assemble Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --build-cache

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qabas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7


      # ── بناء xdelta3 لأندرويد (arm64 + armv7) لتمكين التحديث الصغير على الجهاز ──
      - name: Build xdelta3 for Android
        if: success() && github.event_name == 'push'
        run: |
          set -e
          echo "Installing NDK..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" 2>/dev/null || \
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" 2>/dev/null || true

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "⚠️ NDK not found — skipping Android xdelta3 build"
            exit 0
          fi
          echo "Using NDK: $NDK_DIR"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          if [ ! -d "$TOOLCHAIN" ]; then
            echo "⚠️ NDK toolchain missing"
            exit 0
          fi

          mkdir -p /tmp/xdelta_android
          cd /tmp/xdelta_android
          curl -sL "https://github.com/jmacd/xdelta/archive/refs/tags/v3.1.0.tar.gz" -o src.tgz
          tar -xzf src.tgz
          SRC=$(find . -name 'xdelta3.c' | head -1 | xargs dirname)
          cd "$SRC"

          # xdelta3.h يتوقع SIZEOF_* من سكربت configure (autotools) وهو غائب هنا
          # لأننا نجمّع الملف الواحد مباشرة بدون autoconf — بدونها يسقط على
          # "#error Bad configure script" ولا يعرّف usize_t/xoff_t إطلاقاً.
          # على أندرويد (Bionic/Clang): 64-بت ABI فيها long/size_t = 8 بايت (LP64)،
          # و32-بت ABI فيها long/size_t = 4 بايت (ILP32). unsigned long long = 8 دوماً.
          CFLAGS_COMMON="-O2 -fPIE -pie -DXD3_USE_LARGEFILE64=1 -DREGRESSION_TEST=0 -DSECONDARY_DJW=1 -DSECONDARY_FGK=1 -DXD3_MAIN=1 -DNOT_COVER=1 -DSIZEOF_UNSIGNED_INT=4 -DSIZEOF_UNSIGNED_LONG_LONG=8"
          CFLAGS_64="$CFLAGS_COMMON -DSIZEOF_SIZE_T=8 -DSIZEOF_UNSIGNED_LONG=8"
          CFLAGS_32="$CFLAGS_COMMON -DSIZEOF_SIZE_T=4 -DSIZEOF_UNSIGNED_LONG=4"

          build_one() {
            local ABI="$1"
            local TRIPLE="$2"
            local API="$3"
            local WORDSIZE="$4"
            local OUT="/tmp/xdelta_android/xdelta3-${ABI}"
            local CC="$TOOLCHAIN/bin/${TRIPLE}${API}-clang"
            local CFLAGS
            if [ "$WORDSIZE" = "64" ]; then CFLAGS="$CFLAGS_64"; else CFLAGS="$CFLAGS_32"; fi
            if [ ! -x "$CC" ]; then
              echo "⚠️ Compiler not found: $CC"
              return 0
            fi
            echo "Building xdelta3 for $ABI ..."
            "$CC" $CFLAGS -o "$OUT" xdelta3.c -lm 2>&1 || {
              echo "⚠️ Build failed for $ABI"
              return 0
            }
            chmod +x "$OUT"
            ls -la "$OUT"
            file "$OUT" || true
          }

          build_one "arm64-v8a" "aarch64-linux-android" "24" "64"
          build_one "armeabi-v7a" "armv7a-linux-androideabi" "24" "32"
          build_one "x86_64" "x86_64-linux-android" "24" "64"

          echo "Built binaries:"
          ls -la /tmp/xdelta_android/xdelta3-* 2>/dev/null || echo "(none)"

            # ── Delta Patch: ملف صغير بدل APK كامل (إصلاح سبتمبر 2026) ──
      - name: Generate delta patch & publish release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NEW_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE="${{ github.run_number }}"
          APK_SIZE=$(du -h "$NEW_APK" | cut -f1)
          APK_BYTES=$(stat -c%s "$NEW_APK")
          TAG="v${VERSION}+${{ github.run_number }}"
          IS_DELTA="false"
          PATCH_FILE="/tmp/qabas-${VERSION_CODE}.delta"

          echo "═══════════════════════════════════════"
          echo "APK: $NEW_APK ($APK_SIZE / $APK_BYTES bytes)"
          echo "Version: $VERSION | Code: $VERSION_CODE | Tag: $TAG"
          echo "═══════════════════════════════════════"

          # ── حمّل آخر APK من GitHub Releases ──
          mkdir -p /tmp/prev_release
          LAST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "Last release: ${LAST_RELEASE:-none}"

          if [ -n "$LAST_RELEASE" ] && [ "$LAST_RELEASE" != "null" ] && [ "$LAST_RELEASE" != "" ]; then
            echo "Downloading previous APK from $LAST_RELEASE..."
            if gh release download "$LAST_RELEASE" \
                --pattern "*.apk" \
                --dir /tmp/prev_release \
                --clobber 2>&1; then

              PREV_APK=$(find /tmp/prev_release -name "*.apk" -type f | head -1 || echo "")

              if [ -n "$PREV_APK" ] && [ -f "$PREV_APK" ]; then
                PREV_BYTES=$(stat -c%s "$PREV_APK")
                echo "Previous APK found: $PREV_APK ($PREV_BYTES bytes)"

                # ثبّت xdelta3
                echo "Installing xdelta3..."
                sudo apt-get update -qq
                sudo apt-get install -y -qq xdelta3
                xdelta3 -V 2>&1 || true

                # أنشئ ملف الفرق
                # -e = encode | -s = source | -B = نافذة المصدر 256MB | -9 = أقصى ضغط
                echo "Creating delta patch (this may take 1-3 minutes)..."
                set +e
                xdelta3 -e -9 -B 268435456 -s "$PREV_APK" "$NEW_APK" "$PATCH_FILE" 2>&1
                XDELTA_EXIT=$?
                set -e

                if [ $XDELTA_EXIT -eq 0 ] && [ -f "$PATCH_FILE" ] && [ -s "$PATCH_FILE" ]; then
                  PATCH_BYTES=$(stat -c%s "$PATCH_FILE")
                  PATCH_SIZE=$(du -h "$PATCH_FILE" | cut -f1)
                  echo "✅ Delta patch created successfully: $PATCH_SIZE ($PATCH_BYTES bytes)"
                  echo "   Savings: $(( (APK_BYTES - PATCH_BYTES) * 100 / APK_BYTES ))% smaller than full APK"
                  IS_DELTA="true"
                else
                  echo "❌ xdelta3 failed (exit code: $XDELTA_EXIT)"
                  echo "   Will upload full APK only"
                  ls -la /tmp/qabas-*.delta 2>/dev/null || true
                  IS_DELTA="false"
                fi

                rm -f "$PREV_APK"
              else
                echo "⚠️ No previous APK found after download — uploading full APK only"
                IS_DELTA="false"
              fi
            else
              echo "⚠️ Failed to download previous release — uploading full APK only"
              IS_DELTA="false"
            fi
          else
            echo "ℹ️ No previous releases — uploading full APK only (first release)"
            IS_DELTA="false"
          fi

          # ── ارفع كـ GitHub Release ──
          COMMITS_SINCE_TAG=$(git log "${LAST_RELEASE:-$(git rev-list --max-parents=0 HEAD | head -1)}..HEAD" --pretty=format"- %s" 2>/dev/null | head -20 || true)
          RELEASE_NOTES="Qabas $VERSION ($VERSION_CODE) | APK: $APK_SIZE"

          if [ "$IS_DELTA" = "true" ]; then
            PATCH_SIZE=$(du -h "$PATCH_FILE" | cut -f1)
            RELEASE_NOTES="$RELEASE_NOTES | Delta: $PATCH_SIZE"
          fi

          RELEASE_NOTES="$RELEASE_NOTES | Download .delta for small update, or full APK"

          if [ -n "$COMMITS_SINCE_TAG" ]; then
            RELEASE_NOTES=$(printf '%s\nالتغييرات:\n%s' "$RELEASE_NOTES" "$COMMITS_SINCE_TAG")
          fi

          # احذف Release قديم بنفس الـ tag لو موجود
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # أنشئ Release جديد مع الـ APK
          gh release create "$TAG" \
            --title "Qabas $VERSION" \
            --notes "$RELEASE_NOTES" \
            "$NEW_APK"

          # أضف ملف Delta إن وُجد
          if [ "$IS_DELTA" = "true" ] && [ -f "$PATCH_FILE" ]; then
            gh release upload "$TAG" "$PATCH_FILE" --clobber
            echo "✅ Delta patch uploaded alongside full APK"
          else
            echo "ℹ️ No delta uploaded (full APK only)"
          fi

          # ارفع ثنائيات xdelta3 لأندرويد (لتفعيل التحديث الصغير على الجهاز)
          for BIN in /tmp/xdelta_android/xdelta3-arm64-v8a /tmp/xdelta_android/xdelta3-armeabi-v7a /tmp/xdelta_android/xdelta3-x86_64; do
            if [ -f "$BIN" ] && [ -s "$BIN" ]; then
              gh release upload "$TAG" "$BIN" --clobber
              echo "✅ Uploaded $(basename "$BIN")"
            fi
          done

          echo "✅ Release published: $TAG"
          echo "   IS_DELTA=$IS_DELTA"

      - name: On failure — print Kotlin errors hint
        if: failure()
        run: |
          echo "ابحث في اللوج عن: e: file://  أو Unresolved reference"
